name: Synth Browser Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Verify runner capacity
        shell: pwsh
        run: |
          $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Free C: drive space: $free GB"
          if ($free -lt 10) {
            throw "Not enough free disk space for the Tauri installer build."
          }

      - name: Build fallback installer
        shell: pwsh
        run: |
          & "$PWD\scripts\build-installer.ps1" -SkipAzecotronRuntime

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -File -Include *.exe
          if (-not $artifacts) {
            throw "No .exe or .msi installer was produced."
          }
          $artifacts | ForEach-Object {
            Write-Host "$($_.Name) $($_.Length) bytes"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: synth-browser-windows-installer
          if-no-files-found: error
          path: release/*
          retention-days: 14
