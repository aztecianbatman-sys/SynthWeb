name: Synth Browser Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup depot_tools
        shell: cmd
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "%RUNNER_TEMP%\depot_tools"
          echo %RUNNER_TEMP%\depot_tools>> "%GITHUB_PATH%"

      - name: Configure MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%RUNNER_TEMP%\depot_tools;%PATH%"
          where cl
          where link
          where rc
          where python
          where node
          where cargo
          where fetch
          where gclient
          where gn
          where autoninja

      - name: Build Synth Browser installer
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > "%RUNNER_TEMP%\vsinstall.txt"
          set /p VSINSTALL=<"%RUNNER_TEMP%\vsinstall.txt"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%RUNNER_TEMP%\depot_tools;%PATH%"
          call scripts\build-installer.cmd

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: synth-browser-windows-installer
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/installer-manifest.json
          retention-days: 14
