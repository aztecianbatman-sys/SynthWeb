name: Azecotron Chromium

on:
  workflow_dispatch:

jobs:
  build-azecotron:
    name: Build pinned Azecotron Chromium
    runs-on: [self-hosted, windows]
    timeout-minutes: 360

    steps:
      - name: Checkout SynthWeb
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Verify depot_tools
        shell: cmd
        run: |
          where fetch
          where gclient
          where gn
          where autoninja
          git config --global core.longpaths true

      - name: Prepare pinned Chromium fork
        shell: cmd
        run: call scripts\bootstrap-azecotron.cmd

      - name: Build Azecotron
        shell: cmd
        run: |
          call scripts\build-azecotron.cmd
          if errorlevel 1 exit /b 1
          call scripts\build-azecotron-host.cmd
          if errorlevel 1 exit /b 1
          if exist src-tauri\resources\azecotron rmdir /S /Q src-tauri\resources\azecotron
          mkdir src-tauri\resources\azecotron
          xcopy /E /I /Y third_party\azecotron-chromium\src\out\Azecotron\* src-tauri\resources\azecotron\ >nul
          if errorlevel 1 exit /b 1

      - name: Smoke test Chromium runtime
        shell: cmd
        run: |
          set "AZECOTRON=third_party\azecotron-chromium\src\out\Azecotron\azecotron_host.exe"
          if not exist "%AZECOTRON%" exit /b 1
          "%AZECOTRON%" --version > azecotron-version.txt
          if errorlevel 1 exit /b 1
          "%AZECOTRON%" --synth-url=about:blank --headless --disable-gpu --dump-dom about:blank > smoke.html
          if errorlevel 1 exit /b 1
          findstr /c:"<html" smoke.html
          if errorlevel 1 exit /b 1

      - name: Write build manifest
        shell: pwsh
        run: |
          $rev = (Select-String -Path chromium/REVISION -Pattern '^Revision:\s*(.+)$').Matches.Groups[1].Value
          $ver = (Select-String -Path chromium/REVISION -Pattern '^Version:\s*(.+)$').Matches.Groups[1].Value
          @(
            "product=Azecotron Web"
            "chromium_version=$ver"
            "chromium_revision=$rev"
            "base=chromium/src"
            "branding=Synth Browser"
            "sandbox=preserved"
            "build_target=//azecotron/app:azecotron_host"
            "runtime_model=Synth ContentMain + Synth BrowserContext + WebContents"
            "smoke_test=headless about:blank"
          ) | Set-Content azecotron-build-manifest.txt

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: azecotron-build-manifest
          path: |
            azecotron-build-manifest.txt
            azecotron-version.txt
            smoke.html
