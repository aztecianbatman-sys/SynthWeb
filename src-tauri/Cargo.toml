[package]
name = "synth-browser"
version = "0.1.0"
description = "Synth Browser desktop browser"
authors = ["Synth Browser Contributors"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.5.1" }

[dependencies]
tauri = { version = "2.11.5", features = ["wry", "unstable", "devtools"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.7"
dirs-next = "2.0.0"
thiserror = "2.0.16"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-tls"] }
keyring = "4.2.0"
sha2 = "0.10.9"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
futures-util = "0.3.31"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

urlencoding = "2.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true


[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
webview2-com = "0.38.2"

base64 = "0.22.1"
tokio = { version = "1.47.1", features = ["fs", "io-util"] }
